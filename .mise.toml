[tools]
node = "22.23.2"
pnpm = "11.22.0"
rust = "1.97.1"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install JavaScript dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the Tauri desktop app in development mode"
run = "pnpm tauri dev"

[tasks.build]
description = "Build the desktop app"
run = "pnpm tauri build"

[tasks.check]
description = "Check the frontend and Rust application"
run = "pnpm build && cargo check --manifest-path src-tauri/Cargo.toml"
